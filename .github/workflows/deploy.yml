name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  Build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Archive dist for release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: (cd dist && zip -r ../jlens-dist.zip .)

      - name: Upload release dist archive
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: jlens-dist
          path: jlens-dist.zip
          retention-days: 5

  Deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: Build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        id: deployment

  Release:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download release dist archive
        uses: actions/download-artifact@v4
        with:
          name: jlens-dist

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          ASSET="jlens-${TAG}-dist.zip"
          mv jlens-dist.zip "$ASSET"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists. Skipping."
          else
            echo "Creating GitHub Release $TAG"
            gh release create "$TAG" "$ASSET" \
              --target "${{ github.sha }}" \
              --title "JLens $TAG" \
              --generate-notes
          fi
